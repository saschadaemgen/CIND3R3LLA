# The shared SNI stream splitter — /etc/nginx/stream.d/00-smp-splitter.conf.
#
# Committed under D-089. This existed ONLY on the running server until now: the
# Season 3 close-out (CCB-S3-028) had to read it off the host to write D-081, and
# a topology that exists in exactly one place, with no copy and no history, is one
# `rm` away from having to be reverse-engineered.
#
# WHY IT EXISTS. This is a shared VPS. A SimpleX SMP relay and the HTTPS vhosts
# both want :443. The splitter takes the port, reads the TLS SNI without
# terminating anything (`ssl_preread`), and forwards the raw connection to
# whichever backend the name maps to. Everything not explicitly mapped goes to
# 127.0.0.1:4443, where the ordinary HTTPS vhosts listen with proxy_protocol on.
#
# CONSEQUENCES, both of which have bitten:
#   1. A new HTTPS vhost needs NO change here. `default` already covers it. It
#      needs `listen 127.0.0.1:4443 ssl proxy_protocol;` and nothing else.
#   2. A RESERVED hostname is not automatically safe. Unmapped names fall to the
#      default, so a name with no vhost of its own lands on whatever is default
#      there. That is why demo.cind3r3lla.com has an explicit `return 404` block
#      rather than being left unconfigured.
#
# Hostnames below are the operator's real ones for the SMP relay only, which is a
# published SimpleX server address. The console hostname is deliberately absent
# from this repository (CCB-S3-028).
#
# Lives in the `stream {}` context, NOT `http {}`.

map $ssl_preread_server_name $upstream_443 {
    smp.simplego.dev  127.0.0.1:8091;
    default           127.0.0.1:4443;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_protocol on;
    proxy_pass $upstream_443;
}

# The SMP relay speaks no proxy_protocol, so this hop strips it back off.
server {
    listen 127.0.0.1:8091 proxy_protocol;
    proxy_pass 127.0.0.1:8090;
}
