# Cinderella admin console — public nginx vhost over Let's Encrypt TLS (Addendum 4).
#
# The console is public and appless, secured by passkeys (WebAuthn) — not by
# network location. nginx terminates TLS and reverse-proxies to Fastify on
# 127.0.0.1. Replace cinderella.example.org with the real admin hostname; keep
# the real hostname out of this public repo (set it on the server).
#
# Issue the cert without permanently rewriting vhosts, then enable this file:
#   certbot certonly --nginx -d cinderella.example.org
#   cp deploy/nginx-admin.conf /etc/nginx/sites-available/cinderella-admin
#   ln -sf ../sites-available/cinderella-admin /etc/nginx/sites-enabled/cinderella-admin
#   nginx -t && systemctl reload nginx     # reload, never restart (shared host)
#
# WebAuthn requires a secure context + a domain-based RP ID — this public
# hostname + real TLS satisfies it (a bare IP or plain HTTP would not).
# This supersedes Addendum 3's WireGuard-interface vhost; remove that one.
#
# TOPOLOGY (D-081, recorded here under D-089 so the repository stops being wrong
# about it). Public :443 is an SNI STREAM SPLITTER shared with neighbouring
# services — see deploy/nginx-stream-splitter.conf. It maps
# $ssl_preread_server_name to a backend and defaults to 127.0.0.1:4443, so every
# HTTPS vhost on this host listens on LOOPBACK with proxy_protocol rather than on
# a public interface. That is why the listen line below is 127.0.0.1:4443 and not
# 443. A plain `listen 443 ssl` here would collide with the splitter and fail to
# bind. The previous version of this file said 443 and was simply stale.
#
# The marketing site is NOT here. It is a separate service, a separate unit and a
# separate repository (D-089): cinderella-site on 127.0.0.1:8788, with its own
# vhost in that repository's deploy/nginx-site.conf. This file serves the console
# and the public archive front only.

server {
    listen 80;
    listen [::]:80;
    server_name cinderella.example.org;
    # Let certbot answer ACME HTTP-01 here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Behind the SNI splitter (see the topology note above), never a public bind.
    listen 127.0.0.1:4443 ssl proxy_protocol;
    http2 on;
    server_name cinderella.example.org;

    ssl_certificate     /etc/letsencrypt/live/cinderella.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinderella.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # The app also sets HSTS from its (configurable) settings; this is the edge
    # backstop. Enable `preload` only once you are certain (it is hard to undo).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Robots policy is APP-AUTHORITATIVE (CCB-S2-012): since the domain root now serves
    # the public, indexable marketing site (with the admin behind auth at /dashboard),
    # nginx must NOT blanket-noindex the host. The app sets `X-Robots-Tag` per surface —
    # `noindex, nofollow` on every admin response, `index, follow` on the marketing site
    # (noindex on thin stubs) — so there is deliberately no server-level X-Robots-Tag here.

    # Unknown Host headers never reach Cinderella: this server matches only the
    # exact server_name, and it is NOT marked default_server, so other hosts fall
    # through to nginx's existing default handling (return 444 there if desired).

    # Public archive front (CCB-S2-003) — INDEXABLE (the SEO goal). `add_header` in a
    # location REPLACES the server-level add_headers, so HSTS is re-added here; the
    # embed's `index, follow` is kept explicit for older instances that predate the
    # app-authoritative robots header. The app sets the embed's CSP/framing/cache.
    location /embed/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 1m;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Robots-Tag "index, follow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 1m;
    }
}
